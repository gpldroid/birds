<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#102a24">
    <title>Avian World — Content Manager</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f4f7f4; color: #172b25; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
      main { width: min(42rem, 100%); padding: clamp(1.5rem, 5vw, 3rem); background: white; border: 1px solid #dce6df; border-radius: 1.25rem; box-shadow: 0 20px 70px #102a2412; }
      .mark { width: 3rem; height: 3rem; display: grid; place-items: center; border-radius: 1rem; background: #e7f0e8; font-size: 1.5rem; }
      h1 { margin: 1.25rem 0 .5rem; font-family: Georgia, serif; font-size: clamp(2rem, 6vw, 3rem); font-weight: 500; letter-spacing: -.04em; }
      p { color: #53665d; line-height: 1.7; }
      .hint { margin-top: 1.5rem; padding: 1rem; border-radius: .75rem; background: #f4f7f4; font-size: .9rem; }
      a { color: #216448; }
    </style>
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@3.9.2/dist/decap-cms.js"></script>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">🐦</div>
      <h1>Avian World CMS</h1>
      <p>Manage bird profiles and editorial articles. Sign in with the GitHub account that has write access to the <strong>gpldroid/birds</strong> repository.</p>
      <div class="hint">The editor loads below after Decap CMS initializes. GitHub sign-in requires the OAuth proxy configured in the repository documentation.</div>
    </main>
    <script>
      window.addEventListener("load", function () {
        if (window.CMS && window.CMS.init) window.CMS.init();
      });
    </script>
  </body>
</html>
